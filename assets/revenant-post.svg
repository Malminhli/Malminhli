<text x="182" y="478">The <tspan class="b">spec</tspan> is the real work.</text>
<text x="182" y="544">AI writes code fast. <tspan class="b">It can&#8217;t decide what&#8217;s true.</tspan></text>
<text x="182" y="610">Review is a <tspan class="b">loop</tspan>, not a step.</text>
